 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antes de saber que eras tú</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at top, #23395d, #050814);
    color: white;
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.stars {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: 0.4;
    animation: move 20s linear infinite;
}

@keyframes move {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-100px);
    }
}

.content {
    z-index: 2;
    padding: 30px;
}

h1 {
    font-size: 45px;
    margin-bottom: 20px;
    animation: aparecer 3s ease;
}

p {
    font-size: 20px;
    opacity: 0.9;
}

button {
    margin-top: 30px;
    padding: 15px 30px;
    border-radius: 30px;
    border: none;
    background: #ffffff;
    color: #111;
    font-size: 16px;
    cursor: pointer;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>

<body>

<div class="stars"></div>

<div class="content">

<h1>Antes de saber que eras tú</h1>

<p>
Hay historias que no terminan en la última página...
<br>
solo comienzan un nuevo capítulo.
</p>

<button>
❤️ Entrar a nuestros recuerdos
</button>

</div>

</body>
</html>
